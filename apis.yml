aid: juliahub
name: Juliahub
description: >-
  JuliaHub is the company behind the Julia programming language, offering a cloud
  platform for large-scale, reproducible Julia computing — batch jobs, dataset
  management, application hosting, and a private package server — alongside
  modeling and simulation products (Dyad / JuliaSim) and pharmaceutical modeling
  (Pumas). The JuliaHub platform is accessed programmatically via the official
  JuliaHub.jl Julia client and the `jh` command-line interface, authenticated
  with OpenID Connect / OAuth2 (device flow) through a Dex identity provider.
